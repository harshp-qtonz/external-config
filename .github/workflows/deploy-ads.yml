name: Deploy qtonzgames.com ads.txt

on:
  push:
    branches:
      - main
    paths:
      - "domians/qtonzgames.com/ads.txt"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.QTONZ_SSH_KEY }}

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.QTONZ_KNOWN_HOST }}" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH
        run: |
          ssh \
            -p "${{ secrets.QTONZ_PORT }}" \
            "${{ secrets.QTONZ_USER }}@${{ secrets.QTONZ_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy ads.txt
        run: |
          scp \
            -P "${{ secrets.QTONZ_PORT }}" \
            "domians/qtonzgames.com/ads.txt" \
            "${{ secrets.QTONZ_USER }}@${{ secrets.QTONZ_HOST }}:/home/u161747808/public_html/ads1.txt"

      - name: Verify deployment
        run: |
          ssh \
            -p "${{ secrets.QTONZ_PORT }}" \
            "${{ secrets.QTONZ_USER }}@${{ secrets.QTONZ_HOST }}" \
            "ls -lh /home/u161747808/public_html/ads1.txt"
